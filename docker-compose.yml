services:
  # Application Service (Laravel/PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventori-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventori}
      DB_USERNAME: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:4321}
      # Mail Configuration
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel}
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
      - public-build:/var/www/public/build
    networks:
      - inventori-network

  # Web Server Service (Nginx)
  web:
    image: nginx:alpine
    container_name: inventori-web
    restart: unless-stopped
    ports:
      - "4321:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - public-build:/var/www/public/build
    depends_on:
      - app
    networks:
      - inventori-network

  # Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: inventori-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventori}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "24434:3306"
    networks:
      - inventori-network

networks:
  inventori-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  vendor:
    driver: local
  public-build:
    driver: local